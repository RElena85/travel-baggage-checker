name: CI

on:
  push:
    branches: [main, 'squad/**']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-manager-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: trip-manager-app/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --forceExit --passWithNoTests
        env:
          CI: true

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trip-manager-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: trip-manager-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python create_e2e_tests.py
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: trip-manager-app/playwright-report/
          retention-days: 30
